name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt

      - name: DB 스키마·RLS 테스트
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database schema_test"
          psql -v ON_ERROR_STOP=1 -d schema_test -f supabase/tests/00_supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d schema_test -c "set search_path=public,extensions" -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d schema_test -f supabase/tests/01_behavior_tests.sql
          psql -v ON_ERROR_STOP=1 -d schema_test -f supabase/tests/02_rent_transactions_tests.sql

      - name: 파이프라인 테스트 (멱등성 포함)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database pipeline_test"
          psql -v ON_ERROR_STOP=1 -d pipeline_test -f supabase/tests/00_supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d pipeline_test -c "set search_path=public,extensions" -f "$f"
          done
          TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/pipeline_test" python -m pytest -q pipelines/tests
