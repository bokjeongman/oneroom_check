name: collect

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 03:17 KST
  workflow_dispatch:
    inputs:
      from_year_month:
        description: "시작 월 (YYYYMM, 비우면 최근 3개월)"
        required: false
      to_year_month:
        description: "끝 월 (YYYYMM, 비우면 이번 달)"
        required: false

concurrency:
  group: collect          # 수집이 겹쳐 돌지 않게
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt

      - name: 법정동 적재 (regions)
        run: python -m pipelines.load_regions "경기도 성남시"

      - name: 전월세 실거래 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.from_year_month }}" ]; then ARGS="$ARGS --from ${{ inputs.from_year_month }}"; fi
          if [ -n "${{ inputs.to_year_month }}" ]; then ARGS="$ARGS --to ${{ inputs.to_year_month }}"; fi
          python -m pipelines.collect_rent_transactions $ARGS
